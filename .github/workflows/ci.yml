name: CIRCUIT Celo CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Package verified source for deployment
        if: github.ref == 'refs/heads/feature/control-center-mcp'
        uses: actions/upload-artifact@v4
        with:
          name: circuit-celo-source
          path: |
            .
            !node_modules
            !.git
          include-hidden-files: true
          retention-days: 1
